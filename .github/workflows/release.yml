name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build Project
      run: |
        cmd /c build.bat
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Package Release
      run: |
        Compress-Archive -Path bin\EndfieldCombatHUD.dll -DestinationPath "EndfieldCombatHUD_${{ github.ref_name }}.zip"

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: EndfieldCombatHUD_${{ github.ref_name }}.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
